services:
  classification:
    build:
      context: .
      dockerfile: Dockerfile
    image: classification:v0
    container_name: classification
    working_dir: /app
    environment:
      BASE_CFG_PATH: /app/cfgs/cfg.yaml
    volumes:
      - ./:/app
      - ../dataset:/dataset
      - ../../../_huggingface:/root/.cache/huggingface  # pretrain
      - ../../../_pytorch:/models  # save
    command: "bash /app/env.sh"
    shm_size: "16gb"
    ports:
      - "8062:8062"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.90.5.2/31
          gateway: 172.90.5.3
          