services:
  scene_text_recognition:
    build:
      context: .
      dockerfile: Dockerfile
    image: scene_text_recognition:v0
    container_name: scene_text_recognition
    working_dir: /app
    environment:
      BASE_CFG_PATH: /app/cfgs/cfg.yaml
      OPENOCR_FOLDER: /app/_externals/sdk/OpenOCR
    volumes:
      - ./:/app
      - ../dataset:/dataset
      - ../../../_pytorch/scene_text_recognition/openocr:/models
    command: "bash /app/env.sh"
    shm_size: "16gb"
    ports:
      - "8063:8063"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.90.5.8/31
          gateway: 172.90.5.9
