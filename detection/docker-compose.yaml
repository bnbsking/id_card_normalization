services:
  rfdetr:
    build:
      context: .
      dockerfile: Dockerfile
    image: rfdetr:v0
    container_name: rfdetr
    working_dir: /app
    environment:
      BASE_CFG_PATH: /app/cfgs/cfg.yaml
    volumes:
      - ./:/app
      - ../dataset:/dataset
      - ../../../_pytorch/rfdetr:/root/.roboflow/models/
    command: "bash /app/env.sh"
    shm_size: "16gb"
    ports:
      - "8061:8061"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.90.5.0/31
          gateway: 172.90.5.1
